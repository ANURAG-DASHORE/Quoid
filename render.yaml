services:
  - type: web
    name: quoid
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - {key: GEMINI_API_KEY, sync: false}
      - {key: LLM_MODEL, value: gemini-3.5-flash,gemini-3.1-flash-lite,gemini-3.5-flash-lite}
      - {key: PAYPAL_CLIENT_ID, sync: false}
      - {key: PAYPAL_CLIENT_SECRET, sync: false}
      - {key: PAYPAL_WEBHOOK_ID, sync: false}
      - {key: PAYPAL_ENV, value: sandbox}
      - {key: DATABASE_URL, sync: false}
